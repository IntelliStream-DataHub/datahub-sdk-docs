page = "docs/industries/energy-utilities/water.mdx"

# Blocks on this page:
#   python #1   L26    Set up demo data
#   java   #1   L51    1. Model the flow network
#   python #2   L63    1. Model the flow network
#   rust   #1   L77    1. Model the flow network
#   java   #2   L99    2. Two zones report trouble — find where the flows meet
#   python #3   L114   2. Two zones report trouble — find where the flows meet
#   rust   #2   L125   2. Two zones report trouble — find where the flows meet

[blocks]
python = 3
java = 2
rust = 2

[python]
timeout = 600
# The demo-data block and step 1 are the same action written twice: the block
# creates the graph inline, the step creates it from a `stations`/`nodes` variable.
# A reader does one or the other, and running both is a duplicate create. The
# numbered step is the tutorial, so that is what runs; the client it needs comes
# from the quickstart, as it would for a reader arriving here.
exclude = [1]
requires = ["quickstart"]

prologue = """

"""

# The page names `assets` in this step but only ever builds the list inside the
# demo-data block above. This is that same list, so the step models the world the
# page describes rather than an invented one.
[[python.inject]]
before = 2
code = """
assets = [intellistream_datahub_sdk.Resource(external_id=x, name=x, labels=[x]) for x in
     ["source_lake_a", "main_trunk_north", "zone_west_12", "zone_east_07"]]
"""

# The page models the network and traverses it in the next breath. The graph read
# path trails writes by a second or two, and an empty neighbourhood is a valid
# answer rather than an error — so without this the page prints the wrong
# conclusion and the test cannot tell that from a real one.
[[python.inject]]
before = 3
code = """
from tutorial_support import wait_for_related
wait_for_related(client, "zone_west_12")
"""

[owns]
resources = ["main_trunk_north", "source_lake_a", "zone_east_07", "zone_west_12"]
timeseries = ["zone_east_07_turbidity_ntu", "zone_west_12_turbidity_ntu"]

# Step 1 builds the flow network through `assets`; these are the nodes it must leave behind.
[expect]
resources = ["source_lake_a", "main_trunk_north", "zone_west_12", "zone_east_07"]
