page = "docs/industries/healthcare/cold-chain.mdx"

# Blocks on this page:
#   python #1   L25    Set up demo data
#   java   #1   L47    1. Watch every fridge live
#   python #2   L69    1. Watch every fridge live
#   rust   #1   L84    1. Watch every fridge live

[blocks]
python = 2
java = 1
rust = 1

[python]
timeout = 600

prologue = """
from tutorial_support import Recorder, feed, take

# Placeholders the page leaves to the reader — 'your dashboard', 'your
# alerting'. Recorders keep what they are handed so the run can prove the
# tutorial's logic actually reached them.
out_of_band = Recorder("out_of_band")
"""

# The page's payoff is the listen loop, so it runs — bounded, not skipped. Two
# declared substitutions make that possible: one starts a background writer so
# messages actually arrive (a silent stream would prove nothing), the other caps
# the loop at three messages and 45 seconds. Both must keep matching the page, so
# a rewritten loop fails here rather than hanging CI.
[[python.replace]]
find = """with client.subscriptions.listen(["pharmacy_fridges"]) as listener:"""
repl = """with client.subscriptions.listen(["pharmacy_fridges"]) as listener:
    feed(client, ["fridge_pharmacy_12_temp_c"], points=40, every=0.3)"""

[[python.replace]]
find = """    for msg in listener:"""
repl = """    for msg in take(listener, 3, 45):"""

[java]
disabled = "Java scenario not written yet."

[rust]
disabled = "Rust scenario not written yet."

[owns]
events = ["cold_chain_excursion_f12_*"]
subscriptions = ["pharmacy_fridges"]
timeseries = ["fridge_pharmacy_12_temp_c"]

[expect]
subscriptions = ["pharmacy_fridges"]
timeseries = ["fridge_pharmacy_12_temp_c"]
