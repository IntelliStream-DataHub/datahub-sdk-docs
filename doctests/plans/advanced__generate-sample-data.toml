[blocks]
python = 15

[python]
timeout = 600

# This page exists to populate a workspace, so it owns a lot — and much of it is
# minted at run time: the fraud graph builds `account_1..30` from a range, and the
# process/drilling/operating-mode fixtures ingest whatever keys their generator
# functions return. Those are patterns; the sweep expands them against the backend.
# Anything missed here survives the sweep and makes the page fail on its next run
# with a duplicate create, which is exactly what "Safe to re-run" must not do.
[owns]
resources = ["account_*"]
events = ["esp_failure_a12_*"]
timeseries = [
  "account_*",
  "cdu_1_*",
  "rig_dw1_*",
  "unit_3_*",
  "pump_07_*", "pump_08_*", "pump_11_*", "pump_19_*", "pump_esp_a12_*",
  "pen_h_07_*",
  "engine_temperature_raw", "engine_vibration_raw",
  "feeder_f12_load_mw", "well_a12_oil_rate_bpd",
]

# A representative sample rather than the whole inventory: if the helper works at all
# it works for every call, and naming one series per fixture family keeps the check
# meaningful without restating the page.
[expect]
timeseries = [
  "pump_07_vibration_mm_s",
  "well_a12_oil_rate_bpd",
  "cdu_1_feed_bpd",
  "unit_3_load_mw",
  "feeder_f12_load_mw",
  "pen_h_07_dissolved_oxygen_mg_l",
  "engine_temperature_raw",
]

# Datapoint counts, not just existence: the recipes read these series, and a series
# that exists but is still empty fails them for a reason that is not their own.
[expect.datapoints]
pump_07_vibration_mm_s = 1000
cdu_1_feed_bpd = 1000
unit_3_load_mw = 1000
pen_h_07_dissolved_oxygen_mg_l = 1000
