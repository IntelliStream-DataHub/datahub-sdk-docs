page = "docs/industries/built-environment/smart-buildings.mdx"

# Blocks on this page:
#   python #1   L25    Set up demo data
#   java   #1   L51    1. Watch comfort live
#   python #2   L73    1. Watch comfort live
#   rust   #1   L88    1. Watch comfort live
#   java   #2   L119   2. See where the energy goes
#   python #3   L137   2. See where the energy goes
#   rust   #2   L153   2. See where the energy goes

[blocks]
python = 3
java = 2
rust = 2

[python]
timeout = 600

prologue = """
from tutorial_support import Recorder, feed, take

# Placeholders the page leaves to the reader — 'your dashboard', 'your
# alerting'. Recorders keep what they are handed so the run can prove the
# tutorial's logic actually reached them.
chart_daily_kwh = Recorder("chart_daily_kwh")
outside_comfort = Recorder("outside_comfort")
"""

# The page's payoff is the listen loop, so it runs — bounded, not skipped. Two
# declared substitutions make that possible: one starts a background writer so
# messages actually arrive (a silent stream would prove nothing), the other caps
# the loop at three messages and 45 seconds. Both must keep matching the page, so
# a rewritten loop fails here rather than hanging CI.
[[python.replace]]
find = """with client.subscriptions.listen(["tower_a_comfort"]) as listener:"""
repl = """with client.subscriptions.listen(["tower_a_comfort"]) as listener:
    feed(client, ["zone_l8_co2_ppm"], points=40, every=0.3)"""

[[python.replace]]
find = """    for msg in listener:"""
repl = """    for msg in take(listener, 3, 45):"""

[java]
disabled = "Java scenario not written yet."

[rust]
disabled = "Rust scenario not written yet."

[owns]
events = ["comfort_alert_l8_*"]
subscriptions = ["tower_a_comfort"]
timeseries = ["tower_a_l8_energy_kwh", "zone_l8_co2_ppm"]

[expect]
subscriptions = ["tower_a_comfort"]
timeseries = ["tower_a_l8_energy_kwh", "zone_l8_co2_ppm"]
