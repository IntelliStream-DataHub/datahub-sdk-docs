page = "docs/industries/transport-logistics/last-mile.mdx"

# Blocks on this page:
#   python #1   L23    Set up demo data
#   java   #1   L43    1. Catch a slipping route live
#   python #2   L65    1. Catch a slipping route live
#   rust   #1   L80    1. Catch a slipping route live

[blocks]
python = 2
java = 1
rust = 1

[python]
timeout = 600

prologue = """
from tutorial_support import Recorder, feed, take

# Placeholders the page leaves to the reader; a Recorder keeps what it is handed.
eta_past_window = Recorder("eta_past_window")
"""

# The page's payoff is the listen loop, so it runs — bounded, not skipped. Two
# declared substitutions make that possible: one starts a background writer so
# messages actually arrive (a silent stream would prove nothing), the other caps
# the loop at three messages and 45 seconds. Both must keep matching the page, so
# a rewritten loop fails here rather than hanging CI.
[[python.replace]]
find = """with client.subscriptions.listen(["fleet_eta"]) as listener:"""
repl = """with client.subscriptions.listen(["fleet_eta"]) as listener:
    feed(client, ["van_22_eta_slack_min"], points=40, every=0.3)"""

[[python.replace]]
find = """    for msg in listener:"""
repl = """    for msg in take(listener, 3, 45):"""

[owns]
events = ["delivery_at_risk_v22_*"]
subscriptions = ["fleet_eta"]
timeseries = ["van_22_eta_slack_min"]

[expect]
subscriptions = ["fleet_eta"]
timeseries = ["van_22_eta_slack_min"]
