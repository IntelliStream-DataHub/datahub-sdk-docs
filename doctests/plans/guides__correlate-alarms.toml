page = "docs/guides/correlate-alarms.mdx"

# python #1 L57  — 2. Walk each alarm's neighbourhood
# python #2 L110 — 3. Find the shared subsystem
[blocks]
python = 2
java = 2
rust = 2

[python]
requires = ["quickstart"]
timeout = 180

# Step 1 of the guide is prose: two alarming sensors that both sit under a shared
# subsystem. The graph below *is* that premise, built with the API the sibling
# guide teaches, so the page's own two blocks stay the code under test.
prologue = """
import intellistream_datahub_sdk as _fixture_sdk
client.resources.create(
    [
        _fixture_sdk.Resource(external_id="cooling_system", name="Cooling system", labels=["System"]),
        _fixture_sdk.Resource(external_id="sensor_a", name="Sensor A", labels=["Sensor"]),
        _fixture_sdk.Resource(external_id="sensor_b", name="Sensor B", labels=["Sensor"]),
    ],
    [
        _fixture_sdk.RelForm.by_external_ids("sensor_a", "cooling_system", "PART_OF"),
        _fixture_sdk.RelForm.by_external_ids("sensor_b", "cooling_system", "PART_OF"),
    ],
)

# The guide's premise is an established graph, not one created a millisecond ago.
# The graph read path lags writes by a second or two, so `fetch_related` returns
# nothing until it catches up. Waiting here is fixture correctness: it puts the
# reader's world in place before the page's own code starts.
import time as _time
for _attempt in range(30):
    if client.resources.fetch_related(
            external_id="sensor_a", depth=5, relationship_types=["PART_OF"]).nodes:
        break
    _time.sleep(0.5)
"""

[owns]
timeseries = ["engine_temperature"]
resources = ["sensor_a", "sensor_b", "cooling_system"]

# The guide's whole payoff is naming the shared subsystem, and its own comment
# says the answer is {'cooling_system'} — so that is what the test demands to see.
[expect]
stdout = ["Both alarms are part of:", "cooling_system"]
