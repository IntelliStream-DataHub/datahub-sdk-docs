page = "docs/industries/healthcare/hospital-operations.mdx"

# Blocks on this page:
#   python #1   L26    Set up demo data
#   java   #1   L47    1. Model the hospital
#   python #2   L69    1. Model the hospital
#   rust   #1   L81    1. Model the hospital
#   java   #2   L117   2. Drive the capacity wall-board live
#   python #3   L140   2. Drive the capacity wall-board live
#   rust   #2   L156   2. Drive the capacity wall-board live

[blocks]
python = 3
java = 2
rust = 2

[python]
timeout = 600

prologue = """
from tutorial_support import Recorder, feed, take

# Placeholders the page leaves to the reader; a Recorder keeps what it is handed.
over_threshold = Recorder("over_threshold")
update_wallboard = Recorder("update_wallboard")
"""

# The page's payoff is the listen loop, so it runs — bounded, not skipped. Two
# declared substitutions make that possible: one starts a background writer so
# messages actually arrive (a silent stream would prove nothing), the other caps
# the loop at three messages and 45 seconds. Both must keep matching the page, so
# a rewritten loop fails here rather than hanging CI.
[[python.replace]]
find = """with client.subscriptions.listen(["bed_capacity"]) as listener:"""
repl = """with client.subscriptions.listen(["bed_capacity"]) as listener:
    feed(client, ["ward_icu_occupancy_pct"], points=40, every=0.3)"""

[[python.replace]]
find = """    for msg in listener:"""
repl = """    for msg in take(listener, 3, 45):"""

[owns]
events = ["capacity_warning_icu_*"]
resources = ["hospital_central", "ward_icu"]
subscriptions = ["bed_capacity"]
timeseries = ["ward_icu_occupancy_pct"]

[expect]
resources = ["hospital_central", "ward_icu"]
subscriptions = ["bed_capacity"]
timeseries = ["ward_icu_occupancy_pct"]
