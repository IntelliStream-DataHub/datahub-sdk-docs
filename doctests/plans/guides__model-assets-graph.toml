page = "docs/guides/model-assets-graph.mdx"

# python #1 L64  — Create the graph
# python #2 L140 — Read the graph back
[blocks]
python = 3
java = 3
rust = 3

[python]
requires = ["quickstart"]
timeout = 180

# Edges are deleted with their end nodes; the sweep already orders resources
# before datasets and retries, so naming the three nodes is enough.

[owns]
# press_07_oil_temp is the series "Link a series to an asset" creates. Unowned, it outlived
# every run and made the next one fail on a duplicate create.
timeseries = ["engine_temperature", "press_07_oil_temp"]
resources = ["plant_oslo", "line_a", "press_07"]

[expect]
resources = ["plant_oslo", "line_a", "press_07"]
stdout = ["3 nodes, 2 edges"]
