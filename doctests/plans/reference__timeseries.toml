page = "docs/reference/timeseries.md"

# Blocks on this page (java, then the python and rust that follow each heading):
#   java #1 Create a series · #2 #3 Ask which type suits a unit · #4 Filter series
#   java #5 Sorting and paging · #6 List and update series · #7 Delete a series
#   java #8 Write datapoints · #9 High-throughput ingestion · #10 #11 Binary ingest
#   java #12 Retrieve datapoints · #13 Latest datapoint · #14 #15 Delete datapoints
#   java #16 #17 IngestResult (#16 is a signature listing, excluded below)

[blocks]
python = 10
java = 17
rust = 10

[python]
timeout = 600
# An API reference, not a tutorial: each fence is a self-contained example, and they
# are meant to be read independently. Running them as one program would invent
# conflicts a reader never meets — the delete example removing what the write example
# needs — so each block runs on its own.
independent = true

# Each example needs a client. Composing the quickstart in to get one would also
# create its `engine_temperature`, which several of these pages create themselves;
# `from_env()` is the constructor this section documents, so this is the reader's
# own call.
prologue = """
import intellistream_datahub_sdk
client = intellistream_datahub_sdk.DataHubClient.from_env()
"""

[java]
disabled = "Java scenario not written yet."
# Independent examples, as for Python. #16 is a list of IngestResult's method signatures, not
# code. It was #13 when this plan was written and the page has grown three blocks since, which
# is exactly what the block-count pin above is for: the old index now points at "Latest
# datapoint", real code that would have stopped being compiled without a word.
independent = true
exclude = [16]

[owns]
timeseries = ["book_value_usd", "engine_temperature"]

[expect]
timeseries = ["book_value_usd", "engine_temperature"]
