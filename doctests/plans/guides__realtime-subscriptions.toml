page = "docs/guides/realtime-subscriptions.mdx"

# python #1 L33  — 1. Create a subscription
# python #2 L107 — 2. Listen and ack                 (not covered — see below)
# python #3 L151 — Change the interest set at runtime (not covered — see below)
[blocks]
python = 4
java = 5
rust = 4

[python]
# Per the sandbox page's own table: it subscribes to engine_temperature and engine_rpm, which the sandbox creates.
requires = ["guides__seed-a-sandbox-data"]
only = [1]
timeout = 120

# Blocks 2 and 3 are deliberately left out rather than quietly bounded. Block 2
# blocks forever on a websocket and only returns when a datapoint arrives, and
# block 3 uses `listener` after the `with` that owns it has closed. Testing them
# needs a second process writing datapoints while the listener runs — worth
# building, but a different harness, and pretending otherwise would mean a green
# test over code nobody ran. The [blocks] pin above still catches edits to them.

[owns]
timeseries = ["engine_temperature"]
subscriptions = ["engine_room"]

[expect]
subscriptions = ["engine_room"]
