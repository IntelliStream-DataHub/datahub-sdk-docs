prologue = """
import pandas as _pd
import intellistream_datahub_sdk as _fx

# The reader's own "give me this series over the last N hours" helper. The page
# passes its result straight to retrieve_datapoints, so the name promises a
# RetrieveFilter. A placeholder returning something else fails at the SDK boundary —
# and one that happened to satisfy it would mean the retrieve was never exercised.
def _window(external_id, hours):
    now = _pd.Timestamp.now(tz="UTC")
    return _fx.RetrieveFilter(ts=external_id, start=now - _pd.Timedelta(hours=hours), end=now)

def last_hour(external_id):
    return _window(external_id, 1)

    now = _pd.Timestamp.now(tz="UTC")
    return _fx.RetrieveFilter(ts=external_id, start=now - _pd.Timedelta(hours=hours), end=now)

def last_hour(external_id):
    return _window(external_id, 1)

from tutorial_support import Recorder

# Placeholders the page leaves to the reader; a Recorder keeps what it is handed.

"""

