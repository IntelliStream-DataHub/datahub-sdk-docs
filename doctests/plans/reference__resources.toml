#   python #1   L40    Look up
#   rust   #1   L48    Look up
#   java   #2   L91    Create resources and relations
#   python #2   L117   Create resources and relations
#   rust   #2   L131   Create resources and relations
#   java   #3   L160   Search
#   python #3   L172   Search
#   rust   #3   L180   Search
#   java   #4   L201   Delete
#   python #4   L208   Delete
