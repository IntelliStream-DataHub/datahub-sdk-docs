#   python #5   L251   Traverse the graph
#   rust   #5   L264   Traverse the graph

[blocks]
python = 11
java = 11
rust = 10

[python]
timeout = 600
# An API reference, not a tutorial: each fence is a self-contained example, and they
# are meant to be read independently. Running them as one program would invent
# conflicts a reader never meets — the delete example removing what the write example
# needs — so each block runs on its own.
independent = true

# The traversal example walks out from `sensor_a`, which the sandbox page seeds.
requires_once = ["guides__seed-a-sandbox-data"]

# Each example needs a client. Composing the quickstart in to get one would also
# create its `engine_temperature`, which several of these pages create themselves;
# `from_env()` is the constructor this section documents, so this is the reader's
# own call.
prologue = """
import intellistream_datahub_sdk
client = intellistream_datahub_sdk.DataHubClient.from_env()
"""

# The page models the network and traverses it in the next breath. The graph read
# path trails writes by a second or two, and an empty neighbourhood is a valid
# answer rather than an error — so without this the page prints the wrong
# conclusion and the test cannot tell that from a real one.
[[python.inject]]
before = 8
code = """
from tutorial_support import wait_for_related
wait_for_related(client, "sensor_a")
"""

# Look-up, nearest and export read `plant_oslo` and `pump_1`, which a reader made in the
# create example; independent blocks each start from a swept backend, so they are made again.
[[python.inject]]
before = 3
code = """
client.resources.create(
    [intellistream_datahub_sdk.Resource(external_id="plant_oslo", name="Oslo Plant", labels=["Plant"]),
     intellistream_datahub_sdk.Resource(external_id="pump_1", name="Pump 1", labels=["Pump"])],
    [intellistream_datahub_sdk.RelForm.by_external_ids("plant_oslo", "pump_1", "CONTAINS")])
"""

[[python.inject]]
before = 9
code = """
client.resources.create(
    [intellistream_datahub_sdk.Resource(external_id="plant_oslo", name="Oslo Plant", labels=["Plant"]),
     intellistream_datahub_sdk.Resource(external_id="pump_1", name="Pump 1", labels=["Pump"])],
    [intellistream_datahub_sdk.RelForm.by_external_ids("plant_oslo", "pump_1", "CONTAINS")])
"""

# The export example moves a graph between two tenants' clients; one stack plays both.
[[python.inject]]
before = 10
code = """
client.resources.create(
    [intellistream_datahub_sdk.Resource(external_id="plant_oslo", name="Oslo Plant", labels=["Plant"]),
     intellistream_datahub_sdk.Resource(external_id="pump_1", name="Pump 1", labels=["Pump"])],
    [intellistream_datahub_sdk.RelForm.by_external_ids("plant_oslo", "pump_1", "CONTAINS")])
source = target = client
"""

[owns]
resources = ["plant_oslo", "pump_1"]

# No [expect]: each block runs against a swept backend, so nothing a block creates is
# there afterwards. The proof is that every example executed cleanly.
