page = "docs/industries/built-environment/construction.mdx"

# Blocks on this page:
#   python #1   L24    Set up demo data
#   java   #1   L47    1. Model the site and attach its documents
#   python #2   L79    1. Model the site and attach its documents
#   rust   #1   L97    1. Model the site and attach its documents
#   java   #2   L133   2. Record a safety incident against its zone
#   python #3   L147   2. Record a safety incident against its zone
#   rust   #2   L158   2. Record a safety incident against its zone

[blocks]
python = 3
java = 2
rust = 2

[python]
timeout = 600

# ONCE PER STACK. Step 1 uploads a drawing, and a deleted file keeps its path (delete moves it
# to trash and nothing purges it), so a second run on the same stack fails with "File with
# submitted path or externalId already exists". The same limitation is recorded in
# reference__files.toml. CI boots a fresh stack, where the page runs as written.
[owns]
events = ["safety_incident_l12_*"]
files = ["drawing_level_12_structural_rev_c"]
resources = ["site_harbour_tower", "zone_level_12"]
timeseries = ["crane_02_hours"]

[expect]
resources = ["site_harbour_tower", "zone_level_12"]
timeseries = ["crane_02_hours"]
