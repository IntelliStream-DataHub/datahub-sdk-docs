page = "docs/industries/mining-metals/tailings-safety.mdx"

# Blocks on this page:
#   python #1   L27    Set up demo data
#   java   #1   L49    1. Watch the instruments against trigger levels
#   python #2   L73    1. Watch the instruments against trigger levels
#   rust   #1   L91    1. Watch the instruments against trigger levels

[blocks]
python = 2
java = 1
rust = 1

[python]
timeout = 600

prologue = """
from tutorial_support import Recorder, feed, take

# Placeholders the page leaves to the reader — 'your dashboard', 'your
# alerting'. Recorders keep what they are handed so the run can prove the
# tutorial's logic actually reached them.
# The page documents this one inline: None | "amber" | "red". "red" is what makes
# the escalation branch — the point of the page — actually run.
trigger_level = Recorder("trigger_level", returns="red")
"""

# The page's payoff is the listen loop, so it runs — bounded, not skipped. Two
# declared substitutions make that possible: one starts a background writer so
# messages actually arrive (a silent stream would prove nothing), the other caps
# the loop at three messages and 45 seconds. Both must keep matching the page, so
# a rewritten loop fails here rather than hanging CI.
[[python.replace]]
find = """with client.subscriptions.listen(["tsf_instruments"]) as listener:"""
repl = """with client.subscriptions.listen(["tsf_instruments"]) as listener:
    feed(client, ["piezometer_p14_pore_pressure_kpa"], points=40, every=0.3)"""

[[python.replace]]
find = """    for msg in listener:"""
repl = """    for msg in take(listener, 3, 45):"""

[java]
disabled = "Java scenario not written yet."

[rust]
disabled = "Rust scenario not written yet."

[owns]
events = ["tailings_alarm_p14_*"]
subscriptions = ["tsf_instruments"]
timeseries = ["piezometer_p14_pore_pressure_kpa"]

[expect]
subscriptions = ["tsf_instruments"]
timeseries = ["piezometer_p14_pore_pressure_kpa"]
