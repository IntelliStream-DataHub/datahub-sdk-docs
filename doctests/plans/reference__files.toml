[python]
timeout = 600
# An API reference, not a tutorial: each fence is a self-contained example, and they
# are meant to be read independently. Running them as one program would invent
# conflicts a reader never meets — the delete example removing what the write example
# needs — so each block runs on its own.
independent = true

# Each example needs a client. Composing the quickstart in to get one would also
# create its `engine_temperature`, which several of these pages create themselves;
# `from_env()` is the constructor this section documents, so this is the reader's
# own call.
prologue = """
import intellistream_datahub_sdk
client = intellistream_datahub_sdk.DataHubClient.from_env()

# The upload examples reference a local file the reader is assumed to have.
import pathlib as _pathlib
_pathlib.Path("report.csv").write_text("timestamp,value" + chr(10) + "2026-01-01T00:00:00Z,1" + chr(10))
# The upload examples file under `plant_a`, the data set the Datasets reference creates.
if not client.datasets.by_ids(["plant_a"]):
    client.datasets.create([intellistream_datahub_sdk.Dataset(external_id="plant_a", name="Plant A")])
"""

# The download example reads the report the upload example stored.
[[python.inject]]
before = 4
code = """
try:
    client.files.get_by_external_id("report_2026_q2")
except intellistream_datahub_sdk.DataHubException:
    client.files.upload_file(intellistream_datahub_sdk.FileUpload(
        path="report.csv", destination_path="/reports/2026/", external_id="report_2026_q2", name="q2.csv"))
"""

# KNOWN PLATFORM LIMITATION — this page cannot be made repeatable yet.
# Deleting a file moves it to trash but keeps its *path* reserved, and the SDK
# exposes no way to purge trash (`list_trash` and `restore` exist; nothing removes).
# So the second upload to `/reports/2026/q2.csv` fails with
# "File with submitted path or externalId already exists" forever, on any stack where
# this page has run once. Verified directly: delete reports success, trash size does
# not change, and re-upload still conflicts.
#
# Left failing on purpose. It is a real defect a reader meets the moment they upload,
# delete and re-upload — not something to hide by renaming the path in this plan.

[owns]
datasets = ["plant_a"]
files = ["report_2026_q2"]
